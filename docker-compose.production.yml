version: '3.8'

services:
  # MongoDB with replica set (required for Prisma transactions)
  mongodb:
    image: mongo:7
    container_name: language-exercise-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=exercises
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 5
    networks:
      - app-network

  # Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: language-exercise-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongodb:27017/exercises?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_COOKIE_NAME=${JWT_COOKIE_NAME:-app_token}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - TOKEN_SECRET=${TOKEN_SECRET}
      - REACT_APP_GOOGLE_TRANSLATE_API_KEY=${REACT_APP_GOOGLE_TRANSLATE_API_KEY}
    networks:
      - app-network
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local

networks:
  app-network:
    driver: bridge
